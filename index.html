<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Dasher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
        }

        canvas {
            display: block;
        }

        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        #score-display {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #0ff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff;
            transition: transform 0.2s ease;
        }

        #score-display.bump {
            transform: scale(1.2);
        }

        #best-display {
            position: absolute;
            top: 20px;
            right: 20px;
            color: #f22;
            font-size: 18px;
            font-weight: bold;
            text-shadow: 0 0 10px #f22;
        }

        #start-screen, #game-over-screen {
            background: rgba(0, 0, 0, 0.85);
            padding: 40px 48px;
            border-radius: 16px;
            border: 1px solid #333;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.15), inset 0 0 20px rgba(0,255,255,0.05);
            pointer-events: auto;
            max-width: 90vw;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        h1 {
            color: #fff;
            font-size: 36px;
            margin-bottom: 14px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px #0ff, 0 0 30px #0ff;
        }

        p {
            color: #aaa;
            font-size: 16px;
            line-height: 1.6;
        }

        .controls {
            color: #666;
            font-size: 13px;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #222;
            line-height: 1.7;
        }

        .highlight {
            color: #0ff;
            font-weight: bold;
        }

        .danger { color: #f22; }

        .btn {
            margin-top: 24px;
            padding: 14px 36px;
            font-size: 18px;
            font-family: inherit;
            font-weight: bold;
            letter-spacing: 2px;
            background: transparent;
            color: #0ff;
            border: 2px solid #0ff;
            border-radius: 8px;
            cursor: pointer;
            pointer-events: auto;
            touch-action: manipulation;
            transition: background 0.15s, color 0.15s, box-shadow 0.15s;
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0,255,255,0.1);
        }

        .btn:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }

        .btn:active {
            background: #0ff;
            color: #000;
        }

        .hidden {
            display: none !important;
        }

        #combo-display {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff0;
            font-size: 48px;
            font-weight: bold;
            text-shadow: 0 0 20px #ff0, 0 0 40px #ff0;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }

        #combo-display.show {
            opacity: 1;
        }

        #speed-meter {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 8px;
            pointer-events: none;
        }

        #speed-meter .label {
            color: #888;
            font-size: 12px;
            letter-spacing: 1px;
        }

        #speed-meter .bar {
            width: 120px;
            height: 6px;
            background: #222;
            border-radius: 3px;
            overflow: hidden;
            border: 1px solid #333;
        }

        #speed-meter .fill {
            height: 100%;
            width: 0%;
            background: #0ff;
            border-radius: 3px;
            transition: width 0.3s ease, background 0.5s ease;
            box-shadow: 0 0 6px #0ff;
        }

        #speed-tier {
            position: absolute;
            top: 18px;
            left: 50%;
            transform: translateX(-50%) translateY(-24px);
            color: #0ff;
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0;
            transition: opacity 0.4s ease, color 0.5s ease;
            pointer-events: none;
        }

        #speed-tier.show {
            opacity: 1;
        }

        #vignette {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(0,0,0,0.6) 100%);
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        #close-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.08);
            opacity: 0;
            transition: opacity 0.1s ease;
        }

        .speed-badge {
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: #555;
            font-size: 13px;
            pointer-events: none;
            transition: color 0.5s ease;
        }
    </style>
</head>
<body>

    <div id="ui-layer">
        <div id="score-display">Score: 0</div>
        <div id="best-display" class="hidden">BEST: 0</div>
        <div id="combo-display"></div>
        <div id="speed-meter">
            <span class="label">SPD</span>
            <div class="bar"><div class="fill" id="speed-fill"></div></div>
        </div>
        <div id="speed-tier"></div>
        <div id="vignette"></div>
        <div id="close-flash"></div>
        <div class="speed-badge" id="speed-badge"></div>

        <div id="start-screen">
            <h1>NEON DASHER</h1>
            <p>Dodge the <span class="danger">Red Obstacles</span></p>
            <button class="btn" id="start-btn">PLAY</button>
            <div class="controls" id="controls-hint"></div>
        </div>

        <div id="game-over-screen" class="hidden">
            <h1>GAME OVER</h1>
            <p>Score: <span id="final-score" class="highlight">0</span><br>
               Best: <span id="best-score" class="highlight">0</span></p>
            <button class="btn" id="restart-btn">RETRY</button>
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

<script>
(() => {
    'use strict';

    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const startScreen = document.getElementById('start-screen');
    const gameOverScreen = document.getElementById('game-over-screen');
    const scoreDisplay = document.getElementById('score-display');
    const bestDisplay = document.getElementById('best-display');
    const finalScoreEl = document.getElementById('final-score');
    const bestScoreEl = document.getElementById('best-score');
    const startBtn = document.getElementById('start-btn');
    const restartBtn = document.getElementById('restart-btn');
    const controlsHint = document.getElementById('controls-hint');
    const comboDisplay = document.getElementById('combo-display');

    const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
    controlsHint.innerHTML = isTouch
        ? 'Tap to jump&nbsp;·&nbsp;Drag to move'
        : 'Mouse: move&nbsp;·&nbsp;Click: jump<br>Keyboard: Space / ↑ to jump';

    // UI Elements
    const speedFill = document.getElementById('speed-fill');
    const speedTierEl = document.getElementById('speed-tier');
    const vignetteEl = document.getElementById('vignette');
    const closeFlash = document.getElementById('close-flash');
    const speedBadge = document.getElementById('speed-badge');

    // Game State
    let gameRunning = false;
    let score = 0;
    let speed = 5;
    let animationId;
    let lastTime = 0;
    let spawnTimer = 0;
    let highScore = +(localStorage.getItem('neon-dasher-best') || 0);
    let combo = 0;
    let comboTimer = 0;
    let screenShake = 0;
    let closeCallTimer = 0;
    let currentTier = 0;
    let baseHue = 180; // cyan

    // Speed tiers (score thresholds at which the game intensifies)
    const SPEED_TIERS = [
        { score: 0,    label: '',          hue: 180, spawnMul: 1 },
        { score: 500,  label: 'TURBO',     hue: 200, spawnMul: 0.85 },
        { score: 1500, label: 'OVERDRIVE', hue: 270, spawnMul: 0.7 },
        { score: 3000, label: 'HYPERSPEED',hue: 330, spawnMul: 0.55 },
        { score: 5000, label: 'LUDICROUS', hue: 40,  spawnMul: 0.4 },
        { score: 8000, label: 'IMPOSSIBLE',hue: 0,   spawnMul: 0.3 },
    ];

    // Player
    const player = {
        x: 50,
        y: 0,
        radius: 15,
        targetY: 0,
        color: '#0ff',
        trail: [],
        invincible: 0
    };

    // Obstacles
    let obstacles = [];

    // Particles
    let particles = [];

    // Background stars
    let stars = [];

    // Resize Canvas
    function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        // Reset player Y to center
        if (!gameRunning) {
            player.y = canvas.height / 2;
            player.targetY = canvas.height / 2;
        }
        // Generate stars
        if (stars.length === 0) {
            for (let i = 0; i < 100; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2 + 1,
                    speed: Math.random() * 0.5 + 0.1,
                    brightness: Math.random() * 0.5 + 0.5
                });
            }
        }
    }
    window.addEventListener('resize', resize);
    resize();

    // --- Input Handling ---
    function movePlayer(dy) {
        if (!gameRunning) return;
        player.targetY += dy;
        // Clamp to screen
        if (player.targetY < player.radius) player.targetY = player.radius;
        if (player.targetY > canvas.height - player.radius) player.targetY = canvas.height - player.radius;
    }

    // Touch
    let touchStartY = 0;
    let touchStartX = 0;

    canvas.addEventListener('touchstart', (e) => {
        if (e.target === canvas) {
            touchStartY = e.touches[0].clientY;
            touchStartX = e.touches[0].clientX;
        }
    }, {passive: false});

    canvas.addEventListener('touchmove', (e) => {
        if (e.target === canvas) {
            e.preventDefault(); // Stop scrolling
            const touchY = e.touches[0].clientY;
            const diff = touchY - touchStartY;
            movePlayer(diff);
            touchStartY = touchY;
        }
    }, {passive: false});

    canvas.addEventListener('touchend', (e) => {
        if (e.target === canvas) {
            // Tap logic
            movePlayer(-80); // Default jump up on tap
        }
    }, {passive: false});

    // Mouse (for testing on PC)
    let mouseDown = false;
    let mouseMoved = false;
    canvas.addEventListener('mousedown', () => {
        mouseDown = true;
        mouseMoved = false;
    });
    window.addEventListener('mousemove', (e) => {
        if (mouseDown && gameRunning) {
            mouseMoved = true;
            player.targetY = e.clientY;
            if (player.targetY < player.radius) player.targetY = player.radius;
            if (player.targetY > canvas.height - player.radius) player.targetY = canvas.height - player.radius;
        }
    });
    window.addEventListener('mouseup', () => {
        if (mouseDown && !mouseMoved && gameRunning) movePlayer(-80);
        mouseDown = false;
        mouseMoved = false;
    });

    // Keyboard
    window.addEventListener('keydown', (e) => {
        if (e.code === 'Space' || e.code === 'ArrowUp') {
            e.preventDefault();
            movePlayer(-80);
        }
    });

    // --- Game Logic ---

    function spawnObstacle() {
        const tier = currentTier;
        // Larger obstacles at higher tiers
        const minSize = 30 + tier * 3;
        const maxSize = 50 + tier * 6;
        const size = minSize + Math.random() * (maxSize - minSize);
        const x = canvas.width + 50;
        const y = canvas.height / 2 + (Math.random() * canvas.height - canvas.height / 2);
        
        // Ensure obstacles don't spawn too close vertically to existing ones
        let tooClose = false;
        for (let obs of obstacles) {
            if (Math.abs(obs.y - y) < size * 0.8) {
                tooClose = true;
                break;
            }
        }

        if (!tooClose) {
            // At higher tiers, obstacle color shifts toward orange/red
            let color = '#f22';
            if (tier >= 4) color = '#ff4400';
            if (tier >= 5) color = '#ff0066';
            obstacles.push({ x, y, size, color, passed: false });
        }
    }

    function createParticles(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push({
                x, y,
                vx: (Math.random() - 0.5) * 8,
                vy: (Math.random() - 0.5) * 8,
                life: 1.0,
                color: color
            });
        }
    }

    function getSpeedTier(s) {
        let tier = 0;
        for (let i = SPEED_TIERS.length - 1; i >= 0; i--) {
            if (s >= SPEED_TIERS[i].score) { tier = i; break; }
        }
        return tier;
    }

    function lerpColor(a, b, t) {
        const ah = parseInt(a.slice(1), 16), bh = parseInt(b.slice(1), 16);
        const ar = ah >> 16, ag = (ah >> 8) & 0xff, ab = ah & 0xff;
        const br = bh >> 16, bg = (bh >> 8) & 0xff, bb = bh & 0xff;
        const rr = Math.round(ar + (br - ar) * t);
        const rg = Math.round(ag + (bg - ag) * t);
        const rb = Math.round(ab + (bb - ab) * t);
        return `rgb(${rr},${rg},${rb})`;
    }

    function update() {
        const displayScore = Math.floor(score / 10);

        // Increase difficulty — faster ramp with tier milestones
        const tier = getSpeedTier(displayScore);
        if (tier !== currentTier) {
            currentTier = tier;
            const ti = SPEED_TIERS[tier];
            speed += 2 + tier * 1.5; // Big speed jump on tier up
            screenShake = 12;
            // Show tier announcement
            speedTierEl.textContent = ti.label;
            speedTierEl.style.color = `hsl(${ti.hue}, 100%, 60%)`;
            speedTierEl.classList.add('show');
            setTimeout(() => speedTierEl.classList.remove('show'), 2000);
            createParticles(player.x, player.y, `hsl(${ti.hue},100%,60%)`, 30);
        }

        // Base ramp: starts at 0.008, increases slightly with tier
        speed += 0.008 + tier * 0.002;

        score++;
        scoreDisplay.innerText = `Score: ${displayScore}`;

        // Smooth player movement (Lerp)
        player.y += (player.targetY - player.y) * 0.15;

        // Hue shift with speed
        const hueShift = (speed - 5) * 4;
        baseHue = 180 + hueShift % 360;

        // Speed meter
        const maxSpeed = 25;
        const pct = Math.min(speed / maxSpeed, 1) * 100;
        speedFill.style.width = pct + '%';
        const tierHue = SPEED_TIERS[currentTier].hue;
        speedFill.style.background = `hsl(${tierHue}, 100%, 55%)`;
        speedFill.style.boxShadow = `0 0 8px hsl(${tierHue}, 100%, 55%)`;
        speedBadge.textContent = `SPD ${speed.toFixed(1)}`;
        speedBadge.style.color = `hsl(${tierHue}, 80%, 50%)`;

        // Vignette intensity
        vignetteEl.style.opacity = Math.min((speed - 8) * 0.05, 0.6);

        // Combo system
        comboTimer--;
        if (comboTimer <= 0) {
            combo = 0;
            comboDisplay.classList.remove('show');
        } else {
            combo++;
            comboDisplay.innerText = `COMBO x${combo}`;
            comboDisplay.classList.add('show');
        }

        // Spawn obstacles — faster at higher tiers
        const spawnThreshold = (50 - speed * 2) * SPEED_TIERS[currentTier].spawnMul;
        spawnTimer++;
        if (spawnTimer > Math.max(spawnThreshold, 8)) {
            spawnTimer = 0;
            spawnObstacle();
            // At high tiers, sometimes spawn extras
            if (currentTier >= 3 && Math.random() < 0.3) {
                spawnObstacle();
            }
        }

        // Close call flash decay
        if (closeCallTimer > 0) {
            closeCallTimer--;
            closeFlash.style.opacity = String(closeCallTimer / 8);
        }

        // Update Obstacles
        for (let i = obstacles.length - 1; i >= 0; i--) {
            let obs = obstacles[i];
            obs.x -= speed;

            // Collision Detection
            const dx = player.x - obs.x;
            const dy = player.y - obs.y;
            const dist = Math.sqrt(dx * dx + dy * dy);
            const minDist = player.radius + obs.size / 2;

            if (dist < minDist) {
                gameOver();
                return;
            }

            // Close call detection — flash when obstacle passes player
            if (!obs.passed && obs.x < player.x - obs.size / 2) {
                obs.passed = true;
                if (dist < minDist * 2.5) {
                    closeCallTimer = 8;
                }
            }

            // Remove off-screen
            if (obs.x < -100) {
                obstacles.splice(i, 1);
            }
        }

        // Update Particles
        for (let i = particles.length - 1; i >= 0; i--) {
            let p = particles[i];
            p.x += p.vx;
            p.y += p.vy;
            p.life -= 0.05;
            if (p.life <= 0) particles.splice(i, 1);
        }

        // Screen shake decay
        if (screenShake > 0) {
            screenShake *= 0.9;
            if (screenShake < 0.5) screenShake = 0;
        }
    }

    function draw() {
        // Clear Screen
        ctx.fillStyle = 'rgba(0, 0, 0, 0.3)'; // Trail effect
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // Apply screen shake
        ctx.save();
        if (screenShake > 0) {
            const shakeX = (Math.random() - 0.5) * screenShake * 2;
            const shakeY = (Math.random() - 0.5) * screenShake * 2;
            ctx.translate(shakeX, shakeY);
        }

        // Draw Background Grid — color shifts with speed
        drawGrid();

        // Draw Stars
        drawStars();

        // Draw Particles
        particles.forEach(p => {
            ctx.globalAlpha = p.life;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;

        // Draw Player Trail — longer at higher speed
        if (gameRunning) {
            player.trail.push({ x: player.x, y: player.y });
            const maxTrail = 10 + Math.floor((speed - 5) * 2);
            while (player.trail.length > maxTrail) player.trail.shift();

            player.trail.forEach((t, i) => {
                const alpha = 0.3 + (i / maxTrail) * 0.5;
                ctx.globalAlpha = alpha;
                ctx.fillStyle = player.color;
                ctx.beginPath();
                ctx.arc(t.x, t.y, player.radius * (i / maxTrail), 0, Math.PI * 2);
                ctx.fill();
            });
            ctx.globalAlpha = 1;
        }

        // Draw Player — glow intensifies with speed
        const glowSize = 20 + (speed - 5) * 3;
        ctx.shadowBlur = glowSize;
        ctx.shadowColor = player.color;
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.arc(player.x, player.y, player.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        // Draw Eyes on player
        ctx.fillStyle = '#000';
        const eyeOffset = 5;
        ctx.beginPath();
        ctx.arc(player.x - eyeOffset, player.y - 3, 3, 0, Math.PI * 2);
        ctx.arc(player.x + eyeOffset, player.y - 3, 3, 0, Math.PI * 2);
        ctx.fill();

        // Draw Obstacles — glow and size based on tier
        obstacles.forEach(obs => {
            const tier = currentTier;
            ctx.shadowBlur = 15 + tier * 3;
            ctx.shadowColor = obs.color;
            ctx.fillStyle = obs.color;

            ctx.beginPath();
            ctx.moveTo(obs.x, obs.y - obs.size / 2);
            ctx.lineTo(obs.x + obs.size / 2, obs.y);
            ctx.lineTo(obs.x, obs.y + obs.size / 2);
            ctx.lineTo(obs.x - obs.size / 2, obs.y);
            ctx.closePath();
            ctx.fill();
            
            // Inner core — larger at higher tiers
            const coreSize = obs.size / 4 + tier * 0.5;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(obs.x, obs.y, coreSize, 0, Math.PI * 2);
            ctx.fill();

            // At high tiers, add trailing particles to obstacles
            if (tier >= 2 && Math.random() < 0.4) {
                ctx.globalAlpha = 0.4;
                ctx.fillStyle = obs.color;
                ctx.beginPath();
                ctx.arc(obs.x + obs.size / 2, obs.y + (Math.random() - 0.5) * 4, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
            ctx.shadowBlur = 0;
        });

        ctx.restore();
    }

    function drawGrid() {
        const hue = baseHue;
        ctx.strokeStyle = `hsla(${hue}, 100%, 60%, 0.05)`;
        ctx.lineWidth = 1;
        
        const gridSize = 50;
        const offsetX = -player.x % gridSize;
        const offsetY = -player.y % gridSize;

        for (let x = offsetX; x < canvas.width; x += gridSize) {
            ctx.beginPath();
            ctx.moveTo(x, 0);
            ctx.lineTo(x, canvas.height);
            ctx.stroke();
        }

        for (let y = offsetY; y < canvas.height; y += gridSize) {
            ctx.beginPath();
            ctx.moveTo(0, y);
            ctx.lineTo(canvas.width, y);
            ctx.stroke();
        }
    }

    function drawStars() {
        stars.forEach(star => {
            ctx.globalAlpha = star.brightness;
            ctx.fillStyle = '#fff';
            ctx.beginPath();
            ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
            ctx.fill();
            
            // Move stars slowly
            star.y += star.speed;
            if (star.y > canvas.height) {
                star.y = 0;
                star.x = Math.random() * canvas.width;
            }
        });
        ctx.globalAlpha = 1;
    }

    function gameLoop(timestamp) {
        if (!gameRunning) return;

        update();
        draw();
        animationId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        gameRunning = false;
        createParticles(player.x, player.y, '#f22', 20);
        createParticles(player.x, player.y, '#0ff', 10);
        
        // Draw one last frame
        draw();
        
        const final = Math.floor(score / 10);
        if (final > highScore) {
            highScore = final;
            localStorage.setItem('neon-dasher-best', String(highScore));
        }

        setTimeout(() => {
            finalScoreEl.innerText = final;
            bestScoreEl.innerText = highScore;
            gameOverScreen.classList.remove('hidden');
            scoreDisplay.classList.add('hidden');
            bestDisplay.classList.add('hidden');
        }, 500);
    }

    function startGame() {
        startScreen.classList.add('hidden');
        gameOverScreen.classList.add('hidden');
        scoreDisplay.classList.remove('hidden');
        if (highScore > 0) {
            bestDisplay.textContent = `BEST: ${highScore}`;
            bestDisplay.classList.remove('hidden');
        }
        
        obstacles = [];
        particles = [];
        player.trail = [];
        score = 0;
        speed = 5;
        spawnTimer = 0;
        combo = 0;
        comboTimer = 0;
        screenShake = 0;
        closeCallTimer = 0;
        currentTier = 0;
        baseHue = 180;
        speedFill.style.width = '0%';
        speedTierEl.classList.remove('show');
        vignetteEl.style.opacity = '0';
        player.y = canvas.height / 2;
        player.targetY = canvas.height / 2;
        
        gameRunning = true;
        lastTime = performance.now();
        gameLoop(lastTime);
    }

    startBtn.addEventListener('click', startGame);
    restartBtn.addEventListener('click', startGame);

})();
</script>
</body>
</html>
